<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f5">
<meta name="description" content="상황을 보고 영어로 말하는 반복 연습. 기본표현, 골라서 연습, 자주 틀리는 문장, AI 실전회화.">
<title>3초영어</title>
<!-- APP_VERSION = "v4.2.1" : lets the previous installed web app detect this update. -->
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="practice.css">
</head>
<body>
<main id="setup" class="home">
  <header class="home-heading"><div><span class="brand-label">SPEAKING ROOM</span><h1>3초영어<span class="brand-dot">.</span></h1></div><button id="profileBtn" class="profile-pill" aria-label="내 프로필">나</button></header>
  <button id="engTravel" class="menu-card travel primary-practice"><span class="core-label">매일 반복하는 핵심 연습 <b id="coreDifficulty">기본표현 D1</b></span><span class="core-title">기본표현<span class="core-symbol">⚡</span></span><span class="core-description">상황을 보고, 바로 영어로 말하기.<br>생각보다 먼저 입에서 나오도록 반복해요.</span><span class="core-cta">10회 연습 시작 <span>→</span></span></button>
  <section id="rewardZone" class="reward-panel" aria-label="레벨과 경험치"></section>
  <section id="routineZone" class="routine-panel" aria-label="오늘의 루틴"></section>
  <div class="section-label"><h2>필요할 때 이어서 연습</h2><button id="tutorialBtn" class="quiet">사용법 ?</button></div>
  <nav class="practice-menu" aria-label="연습 선택">
    <button id="engStudy" class="menu-card"><span class="menu-icon">✓</span><span><b>골라서 연습</b><small id="engStudySub">필요한 표현만 골라 반복해요</small></span><span class="arrow">›</span></button>
    <button id="engMiss" class="menu-card"><span class="menu-icon">↻</span><span><b>자주 틀리는 문장</b><small id="engMissSub">틀린 문장을 모아 다시 말해요</small></span><span class="arrow">›</span></button>
    <button id="engReal" class="menu-card"><span class="menu-icon">💬</span><span><b>AI 실전회화</b><small>실제 상황처럼 영어로 주고받아요</small></span><span class="arrow">›</span></button>
  </nav>
  <section id="heroZone" aria-label="내 성장 기록"></section>
  <section id="growthZone" class="growth-panel" aria-label="실력과 성장"></section>
  <div class="home-tools"><button id="rankBtn" class="tool-card">🏆 랭킹 <span>함께 쌓은 기록 ›</span></button><button id="syncBtn" class="tool-card">☁️ 기록 동기화 <span id="syncSummary">기기 간 이어서 ›</span></button></div>
  <p id="notice" role="status" class="notice"></p>
  <footer><button id="verFoot" class="quiet">업데이트 확인</button><a href="privacy.html">개인정보 안내</a></footer>
</main>
<section id="sprint" class="practice-stage" aria-label="표현 연습" hidden><div id="sprintScroll"></div></section>
<section id="stage" class="chat-stage" style="display:none" aria-label="AI 실전회화" hidden>
  <header class="chat-heading"><button id="chatBack" class="quiet" aria-label="홈으로">‹</button><h2 id="sceneTitle">AI 실전회화</h2><button id="ttsBtn" class="quiet" aria-pressed="true" aria-label="영어 자동 읽기">🔊</button></header>
  <div id="nativeVoiceControls" hidden><button id="nativeVoiceStart" class="quiet">🎙 음성으로 대화</button><button id="nativeVoiceStop" class="quiet" hidden>음성 멈추기</button><button id="nativePlanSettings" class="quiet">ChatGPT 연결</button><p id="nativeVoiceStatus" role="status"></p></div>
  <div id="thread" class="thread"><div id="threadInner"></div></div>
  <div class="chat-help"><button id="helpBtn" class="quiet">막혔어요</button><button id="fbBtn" class="quiet">내 표현 확인</button></div>
  <div class="chat-input"><button id="micBtn" class="quiet" aria-label="말해서 답하기">🎤</button><textarea id="msg" rows="1" placeholder="영어로 답해보세요" aria-label="영어 답변"></textarea><button id="sendBtn" class="primary">보내기</button></div>
</section>
<script src="practice-data.js"></script>
<script src="practice.js"></script>
<script src="home-support.js"></script>
<script src="android-native.js"></script>
</body>
</html>

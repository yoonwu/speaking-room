plugins { id 'com.android.application' }
def offlineReview = providers.gradleProperty('offlineReview').map { it.toBoolean() }.getOrElse(false)
android {
    namespace 'com.speakingroom.voice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.speakingroom.voice'
        minSdk 26
        targetSdk 36
        versionCode 22
        versionName '0.6.7'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        buildConfigField 'boolean', 'OFFLINE_REVIEW', offlineReview.toString()
        testInstrumentationRunner 'com.speakingroom.voice.SpeechFlowInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDirs = ['src/main/assets', layout.buildDirectory.dir('webAssets'), layout.buildDirectory.dir('offlineSpeechAssets')]
    if (offlineReview) {
        sourceSets.main.manifest.srcFile 'src/offlineReview/AndroidManifest.xml'
    }
    def uploadStore = System.getenv('SR_UPLOAD_STORE')
    if (uploadStore) {
        signingConfigs {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('SR_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('SR_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('SR_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (uploadStore) signingConfig signingConfigs.upload
        }
    }
}
tasks.register('bundleWebApp', Sync) {
    from(rootProject.file('..')) { include 'index.html', 'practice.js', 'practice-data.js', 'practice-ai.js', 'practice-session.js', 'home-support.js', 'practice.css', 'mascot*.png', 'android-native.js', 'privacy.html', 'icon*.png', 'manifest.webmanifest' }
    into layout.buildDirectory.dir('webAssets')
}
def speechModelUrl = 'https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip'
def speechModelHash = '30f26242c4eb449f948e42cb302dd7a686cb29a3423a8367f99ff41780942498'
def speechModelArchive = layout.buildDirectory.file('offlineSpeechAssets/vosk-en-us-0.15.zip')
tasks.register('bundleOfflineSpeechModel') {
    inputs.property('modelUrl', speechModelUrl)
    inputs.property('modelSha256', speechModelHash)
    outputs.file(speechModelArchive)
    doLast {
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        def target = speechModelArchive.get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        def supplied = providers.gradleProperty('offlineSpeechModelZip').orNull
        def temporary = java.nio.file.Files.createTempFile(target.parent, 'vosk-model-', '.tmp')
        try {
            def connection = supplied ? null : new URI(speechModelUrl).toURL().openConnection()
            if (connection != null) {
                connection.connectTimeout = 15000
                connection.readTimeout = 60000
            }
            def modelStream = supplied ? new FileInputStream(rootProject.file(supplied)) : connection.inputStream
            new java.security.DigestInputStream(modelStream, digest).withCloseable { input ->
                java.nio.file.Files.copy(input, temporary, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            if (digest.digest().encodeHex().toString() != speechModelHash) {
                throw new GradleException('The bundled Vosk English model did not match its pinned SHA-256.')
            }
            java.nio.file.Files.move(temporary, target, java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            java.nio.file.Files.deleteIfExists(temporary)
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'bundleWebApp', 'bundleOfflineSpeechModel' }
dependencies {
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.53.0'
    // Pinned dependency; updates need a separate compatibility check.
    //noinspection GradleDependency
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.47'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

plugins { id 'com.android.application' }
android {
    namespace 'com.speakingroom.voice'
    compileSdk 36
    defaultConfig {
        applicationId 'com.speakingroom.voice'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('webAssets')]
    def uploadStore = System.getenv('SR_UPLOAD_STORE')
    if (uploadStore) {
        signingConfigs {
            upload {
                storeFile file(uploadStore)
                storePassword System.getenv('SR_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('SR_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('SR_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (uploadStore) signingConfig signingConfigs.upload
        }
    }
}
tasks.register('bundleWebApp', Copy) {
    from(rootProject.file('..')) { include 'index.html', 'android-native.js', 'android-voice.html', 'privacy.html', 'shadowing.html', '*-bank.json', 'icon*.png', 'manifest.webmanifest' }
    into layout.buildDirectory.dir('webAssets')
}
tasks.named('preBuild').configure { dependsOn 'bundleWebApp' }
dependencies {
    // Pinned dependency; updates need a separate compatibility check.
    //noinspection GradleDependency
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.nimbusds:nimbus-jose-jwt:9.47'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>쉐도잉 · 여행 표현 30</title>
<style>
  :root{
    --bg:#F6F8F7; --panel:#FFFFFF; --line:#E6EBE8;
    --ink:#16241F; --ink2:#5F726A; --ink3:#93A49C;
    --accent:#0F8A63; --accent-soft:#E8F4EF;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
    display:flex;overflow:hidden}

  /* 왼쪽 — 표현 30개 */
  aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column}
  .a-head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
  .a-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .a-sub{font-size:12.5px;color:var(--ink3);margin-top:3px}
  .a-list{flex:1;overflow-y:auto;padding:8px 10px 20px}
  .fr{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:none;background:none;
    padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-size:13.5px;font-family:inherit}
  .fr:hover{background:#F1F5F3}
  .fr .n{flex:none;width:18px;font-size:11px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .fr .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fr.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .fr.on .n{color:var(--accent)}
  .fr.done .t{color:var(--ink3)}

  /* 오른쪽 — 재생 */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:3px;background:var(--line);flex:none}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 56px;text-align:center;min-height:0}
  .kicker{font-size:11px;letter-spacing:.18em;color:var(--ink3);font-weight:600}
  .frame{font-size:34px;font-weight:600;color:var(--accent);margin-top:14px;letter-spacing:-.02em}
  .frame-ko{font-size:15px;color:var(--ink2);margin-top:6px}
  .dots{display:flex;gap:6px;margin:34px 0 26px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .2s}
  .dots i.p{background:#BFD8CD}
  .dots i.c{background:var(--accent)}
  .line{font-size:32px;font-weight:500;line-height:1.35;letter-spacing:-.02em;max-width:760px}
  .line-ko{font-size:15.5px;color:var(--ink2);margin-top:14px;max-width:640px}
  .hint{margin-top:26px;font-size:13px;color:var(--ink3);height:20px}
  .hint.on{color:var(--accent);font-weight:600}

  /* 아래 — 조작 */
  footer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:16px 28px 18px}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:8px;
    padding:9px 16px;font-size:13.5px;font-family:inherit;cursor:pointer}
  .btn:hover{border-color:#CBD8D2;color:var(--ink)}
  .play{width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:17px;cursor:pointer;display:grid;place-items:center}
  .play:hover{background:#0C7754}
  .segs{display:flex;gap:26px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .seg{display:flex;align-items:center;gap:9px}
  .seg > span{font-size:12px;color:var(--ink3)}
  .seg .opts{display:flex;background:#F1F5F3;border-radius:7px;padding:2px}
  .seg button{border:none;background:none;color:var(--ink2);font-size:12.5px;font-family:inherit;
    padding:5px 11px;border-radius:5px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .keys{margin-top:14px;text-align:center;font-size:11.5px;color:var(--ink3)}
  kbd{font:inherit;background:#F1F5F3;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin:0 1px}

  @media(max-width:820px){
    aside{display:none}
    .stage{padding:28px 22px}
    .frame{font-size:26px} .line{font-size:24px}
  }
</style>
</head>
<body>
<aside>
  <div class="a-head">
    <div class="a-title">여행 표현 30</div>
    <div class="a-sub">듣고 따라 말하기</div>
  </div>
  <div class="a-list" id="list"></div>
</aside>
<main>
  <div class="bar"><i id="bar" style="width:0%"></i></div>
  <div class="stage">
    <div class="kicker">SHADOWING</div>
    <div class="frame" id="frame">—</div>
    <div class="frame-ko" id="frameKo"></div>
    <div class="dots" id="dots"></div>
    <div class="line" id="line"></div>
    <div class="line-ko" id="lineKo"></div>
    <div class="hint" id="hint"></div>
  </div>
  <footer>
    <div class="ctrl">
      <button class="btn" id="prev">← 이전 표현</button>
      <button class="play" id="toggle">▶</button>
      <button class="btn" id="next">다음 표현 →</button>
    </div>
    <div class="segs" id="segs"></div>
    <div class="keys">
      <kbd>Space</kbd> 재생·정지 &nbsp;·&nbsp; <kbd>←</kbd><kbd>→</kbd> 표현 이동 &nbsp;·&nbsp;
      <kbd>↑</kbd><kbd>↓</kbd> 문장 이동 &nbsp;·&nbsp; <kbd>R</kbd> 이 문장 다시
    </div>
  </footer>
</main>
<script>
/* 여행 표현 30개 · 문장 580개 — 앱(index.html)에서 그대로 가져옴 */
const FRAMES = [{"f":"Can I get ~?","k":"~ 주세요 / 받을 수 있을까요?","i":[["Can I get another towel?","호텔 방에 수건이 부족하다. 수건을 하나 더 달라고 해라."],["Can I get some water?","식당 테이블에 물이 없다. 물 좀 달라고 해라."],["Can I get a receipt?","계산을 마쳤는데 영수증을 안 준다. 영수증을 달라고 해라."],["Can I get an iced coffee?","카페 카운터 앞이다. 아이스 커피를 달라고 해라."],["Can I get two tickets?","투어 데스크 앞이다. 두 명 표를 달라고 해라."],["Can I get more rice?","음식이 너무 맵다. 밥을 더 달라고 해라."],["Can I get an extra key?","가족이 따로 다닐 예정이다. 방 열쇠를 하나 더 달라고 해라."],["Can I get a child seat?","Grab을 부른다. 아이가 있으니 카시트를 달라고 해라."],["Can I get a bag for this?","시장에서 물건을 샀는데 담을 게 없다. 봉투를 달라고 해라."],["Can I get a wake-up call at six?","내일 새벽 비행기다. 6시 모닝콜을 받을 수 있는지 물어라."],["Can I get a fork?","아이가 젓가락을 못 쓴다. 포크를 달라고 해라."],["Can I get a map?","길을 자꾸 헤맨다. 프런트에서 지도를 달라고 해라."],["Can I get some ice?","음료가 미지근하다. 얼음을 달라고 해라."],["Can I get a blanket?","배 안이 춥다. 담요를 달라고 해라."],["Can I get one more plate?","같이 나눠 먹으려 한다. 접시를 하나 더 달라고 해라."],["Can I get a spoon?","아이가 국물을 먹는다. 숟가락을 달라고 해라."],["Can I get some napkins?","음식이 흘렀다. 냅킨을 달라고 해라."],["Can I get a to-go box?","남은 음식을 싸 가고 싶다. 포장 용기를 달라고 해라."],["Can I get a discount?","시장에서 여러 개를 샀다. 할인을 받을 수 있는지 물어라."],["Can I get the check?","밥을 다 먹었다. 계산서를 달라고 해라."]]},{"f":"Can you ~?","k":"~해 주실 수 있어요?","i":[["Can you take me to the airport?","Grab에 탔다. 기사에게 공항으로 가달라고 해라."],["Can you watch my bags for a minute?","화장실에 다녀와야 한다. 짐을 좀 봐달라고 부탁해라."],["Can you call a taxi for me?","밤늦게 이동해야 한다. 프런트에 택시를 불러달라고 해라."],["Can you show me on the map?","길을 물었는데 말로는 모르겠다. 지도에서 짚어달라고 해라."],["Can you take a photo of us?","가족이 다 모였다. 지나가는 사람에게 사진 좀 찍어달라고 해라."],["Can you fix the air conditioner?","방이 너무 덥다. 에어컨을 고쳐달라고 해라."],["Can you bring my bags to the room?","짐이 무겁다. 방까지 올려달라고 부탁해라."],["Can you wait here for five minutes?","가게에 잠깐 들를 것이다. 기사에게 5분만 기다려달라고 해라."],["Can you write down the address?","기사에게 보여줄 주소가 필요하다. 적어달라고 해라."],["Can you make it less spicy?","아이가 먹을 음식이다. 덜 맵게 해달라고 부탁해라."],["Can you turn up the air conditioner?","방이 아직 덥다. 에어컨을 세게 틀어달라고 해라."],["Can you check my booking?","예약이 됐는지 모르겠다. 확인해달라고 해라."],["Can you drop us at the entrance?","입구가 멀다. 기사에게 입구 앞에 내려달라고 해라."],["Can you speak in English?","현지어로만 말한다. 영어로 말해달라고 해라."],["Can you help me with this form?","입국 서류를 못 쓰겠다. 도와달라고 해라."],["Can you wrap this as a gift?","선물용으로 샀다. 포장해 달라고 해라."],["Can you hold this for me?","계산하는 동안 물건이 많다. 잠깐 들어달라고 해라."],["Can you split the bill?","둘이 따로 계산하려 한다. 계산서를 나눠 달라고 해라."],["Can you heat this up?","식은 음식이 나왔다. 데워달라고 해라."],["Can you put it in a box?","깨질 물건이다. 상자에 넣어달라고 해라."]]},{"f":"Can I / Can we ~?","k":"~해도 될까요?","i":[["Can we sit by the window?","식당에 자리가 여러 개다. 창가에 앉아도 되는지 물어라."],["Can I take pictures here?","박물관에 들어왔다. 사진을 찍어도 되는지 물어라."],["Can we check out late?","비행기가 저녁이다. 늦게 체크아웃해도 되는지 물어라."],["Can I use the restroom?","카페에서 음료만 샀다. 화장실을 써도 되는지 물어라."],["Can I try this on?","옷 가게에서 사이즈가 걱정된다. 입어봐도 되는지 물어라."],["Can we use the pool after checkout?","체크아웃은 했지만 비행기가 늦다. 수영장을 써도 되는지 물어라."],["Can we bring our kids?","투어를 예약하려는데 아이가 있다. 데려가도 되는지 물어라."],["Can we sit outside?","실내가 너무 덥다. 밖에 앉아도 되는지 물어라."],["Can I charge my phone here?","배터리가 거의 없다. 여기서 충전해도 되는지 물어라."],["Can we join the next tour?","오늘 투어는 마감이라고 한다. 다음 것에 껴도 되는지 물어라."],["Can we come in with a stroller?","유모차를 끌고 있다. 안에 들어가도 되는지 물어라."],["Can I bring food inside?","밖에서 산 음식이 있다. 안에 들고 들어가도 되는지 물어라."],["Can we stay a bit longer?","마감이라고 한다. 조금 더 있어도 되는지 물어라."],["Can I park here?","차 세울 데를 찾았다. 여기 세워도 되는지 물어라."],["Can we swim here?","바다에 사람이 없다. 여기서 수영해도 되는지 물어라."],["Can I taste this?","시식대가 있다. 맛봐도 되는지 물어라."],["Can we order now?","메뉴를 다 골랐다. 지금 주문해도 되는지 물어라."],["Can I come back tomorrow?","가게가 곧 닫는다. 내일 다시 와도 되는지 물어라."],["Can we share one dish?","양이 많아 보인다. 하나를 나눠 먹어도 되는지 물어라."],["Can I return this?","산 옷이 안 맞는다. 반품해도 되는지 물어라."],["Can I still order?","식당 마감 시간이 조금 지났다. 그래도 아직 주문해도 되는지 물어라."],["Can I still check in?","체크인 시간이 많이 지났다. 그래도 지금 체크인해도 되는지 물어라."],["Can we still join the tour?","투어 출발 시간이 거의 다 됐다. 그래도 아직 껴도 되는지 물어라."],["Can we still use the room?","체크아웃 시간이 지났다. 그래도 방을 조금 더 써도 되는지 물어라."],["Can I still buy a ticket for today?","배표 판매 마감이 가깝다. 그래도 오늘 표를 사도 되는지 물어라."]]},{"f":"Do you have ~?","k":"~ 있어요?","i":[["Do you have anything not spicy?","아이가 매운 걸 못 먹는다. 안 매운 메뉴가 있는지 물어라."],["Do you have a room available?","예약 없이 호텔에 들어왔다. 빈방이 있는지 물어라."],["Do you have a bigger size?","입어보니 옷이 작다. 더 큰 사이즈가 있는지 물어라."],["Do you have soy milk?","우유를 못 먹는다. 카페에 두유가 있는지 물어라."],["Do you have space for tomorrow?","내일 호핑투어를 하고 싶다. 자리가 있는지 물어라."],["Do you have an adapter?","콘센트 모양이 다르다. 프런트에 어댑터가 있는지 물어라."],["Do you have an English menu?","메뉴를 못 읽겠다. 영어 메뉴가 있는지 물어라."],["Do you have a high chair?","아이가 어리다. 유아용 의자가 있는지 물어라."],["Do you have sunscreen?","섬에 가는데 선크림을 안 챙겼다. 선크림이 있는지 물어라."],["Do you have a shuttle to the airport?","공항까지 이동해야 한다. 호텔 셔틀이 있는지 물어라."],["Do you have a crib?","아기가 있다. 아기 침대가 있는지 물어라."],["Do you have a locker?","투어 가는 동안 배낭을 두고 싶다. 보관함이 있는지 물어라."],["Do you have a table for four?","식당에 네 명이 왔다. 네 명 자리가 있는지 물어라."],["Do you have life jackets for kids?","배를 탄다. 아이용 구명조끼가 있는지 물어라."],["Do you have a cheaper room?","방값이 생각보다 비싸다. 더 싼 방이 있는지 물어라."],["Do you have this in blue?","색이 마음에 안 든다. 파란색이 있는지 물어라."],["Do you have a smaller size?","옷이 크다. 작은 사이즈가 있는지 물어라."],["Do you have a vegetarian dish?","고기를 안 먹는 사람이 있다. 채식 메뉴가 있는지 물어라."],["Do you have a kids menu?","아이가 먹을 게 없다. 아이 메뉴가 있는지 물어라."],["Do you have this in stock?","진열장에 하나뿐이다. 재고가 있는지 물어라."]]},{"f":"Where is ~?","k":"~ 어디예요?","i":[["Where is baggage claim?","비행기에서 내렸다. 짐 찾는 곳이 어디인지 물어라."],["Where is the restroom?","급하다. 화장실이 어디인지 물어라."],["Where is the breakfast room?","아침 시간이다. 조식 먹는 곳이 어디인지 물어라."],["Where is the pickup area?","Grab을 불렀다. 픽업 장소가 어디인지 물어라."],["Where is the money exchange?","현금이 필요하다. 환전소가 어디인지 물어라."],["Where is the bus stop?","버스 정류장이 근처라는데 안 보인다. 정류장이 어디인지 물어라."],["Where is our gate?","탑승 시간이 다 됐다. 우리 게이트가 어디인지 물어라."],["Where is the pharmacy?","아이가 열이 난다. 약국이 어디인지 물어라."],["Where is the taxi stand?","짐을 다 찾았다. 택시 승강장이 어디인지 물어라."],["Where are the lockers?","짐을 잠깐 넣어두고 싶다. 물품보관함이 어디인지 물어라."],["Where is the elevator?","짐이 무거워 계단은 힘들다. 엘리베이터가 어디인지 물어라."],["Where is the ATM?","현금이 떨어졌다. ATM이 어디인지 물어라."],["Where is the entrance?","건물을 한 바퀴 돌았다. 입구가 어디인지 물어라."],["Where is the convenience store?","밤에 물을 사야 한다. 편의점이 어디인지 물어라."],["Where is the shuttle stop?","호텔 셔틀을 탄다. 셔틀 정류장이 어디인지 물어라."],["Where is the fitting room?","옷을 입어보려 한다. 탈의실이 어디인지 물어라."],["Where is the cashier?","계산하려는데 카운터가 안 보인다. 계산대가 어디인지 물어라."],["Where is the food court?","몰에서 밥을 먹으려 한다. 푸드코트가 어디인지 물어라."],["Where is the supermarket?","물과 과일을 사야 한다. 마트가 어디인지 물어라."],["Where is the duty free shop?","공항에서 시간이 남는다. 면세점이 어디인지 물어라."]]},{"f":"How do I get to ~?","k":"~ 어떻게 가요?","i":[["How do I get to the hotel?","공항에 내렸다. 호텔까지 어떻게 가는지 물어라."],["How do I get to downtown?","호텔 프런트다. 시내까지 가는 방법을 물어라."],["How do I get to the ferry terminal?","섬 가는 배를 타야 한다. 선착장까지 가는 방법을 물어라."],["How do I get to the night market?","저녁에 야시장에 가고 싶다. 가는 방법을 물어라."],["How do I get to the airport?","내일 아침 비행기다. 공항까지 가는 방법을 물어라."],["How do I get to the beach?","바다를 보러 가고 싶다. 해변까지 가는 방법을 물어라."],["How do I get to that restaurant?","추천받은 식당이 있다. 거기까지 가는 방법을 물어라."],["How do I get to the mall?","비가 온다. 실내 쇼핑몰까지 가는 방법을 물어라."],["How do I get to the hospital?","아이가 아프다. 병원까지 가는 방법을 물어라."],["How do I get to the sunset point?","노을을 보러 가려 한다. 전망 좋은 곳까지 가는 방법을 물어라."],["How do I get to the island?","섬에 가고 싶다. 섬까지 어떻게 가는지 물어라."],["How do I get to the park?","공원에 가려 한다. 거기까지 어떻게 가는지 물어라."],["How do I get to the market?","아침 시장에 가고 싶다. 시장까지 어떻게 가는지 물어라."],["How do I get to the bus terminal?","시외버스를 타야 한다. 터미널까지 어떻게 가는지 물어라."],["How do I get to the old town?","구시가지를 걷고 싶다. 거기까지 어떻게 가는지 물어라."],["How do I get to the seafood market?","해산물 시장에 가고 싶다. 거기까지 어떻게 가는지 물어라."],["How do I get to the shopping street?","쇼핑 거리에 가려 한다. 거기까지 어떻게 가는지 물어라."],["How do I get to the top floor?","몰이 크다. 꼭대기 층까지 어떻게 가는지 물어라."],["How do I get to the waterfront?","바닷가 산책로에 가고 싶다. 거기까지 어떻게 가는지 물어라."],["How do I get to the zoo?","아이들이 동물원에 가고 싶어 한다. 거기까지 어떻게 가는지 물어라."]]},{"f":"How long does it take?","k":"얼마나 걸려요?","i":[["How long does it take to get to the hotel?","택시를 탔다. 호텔까지 얼마나 걸리는지 물어라."],["How long does it take to get to the island?","배를 타기 전이다. 섬까지 얼마나 걸리는지 물어라."],["How long does it take?","직원이 조금만 기다리라고 한다. 얼마나 걸리는지 물어라."],["How long does it take on foot?","택시를 안 타고 걸어가려 한다. 얼마나 걸리는지 물어라."],["How long does it take in total?","투어를 예약하려 한다. 전체가 얼마나 걸리는지 물어라."],["How long does it take to check in?","체크인 줄이 길다. 얼마나 걸리는지 물어라."],["How long does it take for laundry?","옷이 다 젖었다. 세탁이 얼마나 걸리는지 물어라."],["How long does it take by taxi?","걸을지 택시를 탈지 고민이다. 택시로 얼마나 걸리는지 물어라."],["How long does it take to get there?","가이드가 다음 장소를 말했다. 거기까지 얼마나 걸리는지 물어라."],["How long does it take to fix it?","에어컨을 고쳐준다고 한다. 얼마나 걸리는지 물어라."],["How long does it take by bus?","버스로 갈지 고민이다. 버스로 얼마나 걸리는지 물어라."],["How long does it take to get my bags?","짐이 아직 안 나왔다. 얼마나 걸리는지 물어라."],["How long does it take one way?","왕복인지 편도인지 헷갈린다. 편도로 얼마나 걸리는지 물어라."],["How long does it take to get to the airport?","공항에 가야 한다. 공항까지 얼마나 걸리는지 물어라."],["How long does it take to clean the room?","방 청소를 부탁했다. 얼마나 걸리는지 물어라."],["How long does it take to cook?","주문한 요리가 오래 걸린다고 한다. 얼마나 걸리는지 물어라."],["How long does it take to get a table?","식당 앞에 줄이 있다. 자리가 나기까지 얼마나 걸리는지 물어라."],["How long does it take to wrap it?","선물 포장을 부탁했다. 얼마나 걸리는지 물어라."],["How long does it take to get a refund?","반품을 했다. 환불까지 얼마나 걸리는지 물어라."],["How long does it take to get through security?","짐을 부치고 나왔다. 보안검색이 얼마나 걸리는지 물어라."]]},{"f":"What time does ~ start/leave?","k":"~ 몇 시에 시작해요/출발해요?","i":[["What time does the tour start?","내일 투어를 예약했다. 몇 시에 시작하는지 물어라."],["What time does the boat leave?","섬에 가려 한다. 배가 몇 시에 출발하는지 물어라."],["What time does breakfast start?","내일 아침 일정이 있다. 조식이 몇 시에 시작하는지 물어라."],["What time does the shop open?","가게 앞인데 아직 닫혀 있다. 몇 시에 여는지 물어라."],["What time does the last bus leave?","늦게까지 놀 예정이다. 막차가 몇 시인지 물어라."],["What time does the pool close?","저녁에 수영하려 한다. 수영장이 몇 시에 닫는지 물어라."],["What time does the show start?","공연을 보러 왔다. 몇 시에 시작하는지 물어라."],["What time does the market close?","야시장에 가려 한다. 몇 시에 닫는지 물어라."],["What time does the next boat leave?","배를 놓쳤다. 다음 배가 몇 시에 뜨는지 물어라."],["What time does check-in start?","예정보다 일찍 도착했다. 체크인이 몇 시부터인지 물어라."],["What time does the restaurant open?","저녁을 먹으러 왔는데 아직 안 연 것 같다. 몇 시에 여는지 물어라."],["What time does the museum close?","박물관에 늦게 왔다. 몇 시에 닫는지 물어라."],["What time does the first boat leave?","아침 일찍 섬에 가려 한다. 첫 배가 몇 시에 뜨는지 물어라."],["What time does the shuttle leave?","공항 셔틀을 탄다. 몇 시에 출발하는지 물어라."],["What time does the tour end?","저녁 약속이 있다. 투어가 몇 시에 끝나는지 물어라."],["What time does the mall open?","아침에 쇼핑을 하려 한다. 몰이 몇 시에 여는지 물어라."],["What time does the kitchen close?","늦게 저녁을 먹으려 한다. 주방이 몇 시에 닫는지 물어라."],["What time does the sale start?","세일한다는 안내를 봤다. 몇 시에 시작하는지 물어라."],["What time does the buffet open?","뷔페를 먹으려 한다. 몇 시에 여는지 물어라."],["What time does the store close today?","오늘 늦게 갈 예정이다. 가게가 몇 시에 닫는지 물어라."]]},{"f":"What time do we need to ~?","k":"몇 시까지 ~해야 해요?","i":[["What time do we need to be in the lobby?","투어 픽업이 있다. 몇 시까지 로비에 있어야 하는지 물어라."],["What time do we need to check out?","내일 떠난다. 몇 시까지 체크아웃해야 하는지 물어라."],["What time do we need to be at the airport?","비행기 시간이 걱정된다. 몇 시까지 공항에 가야 하는지 물어라."],["What time do we need to get on the boat?","배를 타러 간다. 몇 시까지 배에 타야 하는지 물어라."],["What time do we need to come back?","투어 중간에 쉬는 시간이 있다. 몇 시까지 돌아와야 하는지 물어라."],["What time do we need to be ready?","아침에 픽업이 온다. 몇 시까지 준비해야 하는지 물어라."],["What time do we need to leave the room?","늦게 체크아웃하려 한다. 몇 시까지 방을 비워야 하는지 물어라."],["What time do we need to arrive?","공연을 예약했다. 몇 시까지 도착해야 하는지 물어라."],["What time do we need to return the car?","차를 빌렸다. 몇 시까지 반납해야 하는지 물어라."],["What time do we need to be at the pier?","배 시간이 다 됐다. 몇 시까지 선착장에 가야 하는지 물어라."],["What time do we need to order?","주방 마감이 있다고 한다. 몇 시까지 주문해야 하는지 물어라."],["What time do we need to be at the meeting point?","투어 집합이 있다. 몇 시까지 집합 장소에 가야 하는지 물어라."],["What time do we the beach.","해변에서 나오니 모자가 없다. 두고 온 것 같다고 말해라."],["I think I left my bag in the room.","택시를 타고 나서 보니 가방이 없다. 방에 두고 온 것 같다고 말해라."],["I think I left my ticket at the counter.","창구를 지나고 나니 표가 없다. 두고 온 것 같다고 말해라."],["I think I left my shoes at the temple.","사원에서 나오니 신발이 없다. 두고 온 것 같다고 말해라."],["I think I left my water bottle on the tour bus.","투어 버스에서 내리니 물병이 없다. 두고 온 것 같다고 말해라."],["I think I left my card at the shop.","계산하고 나오니 카드가 없다. 가게에 두고 온 것 같다고 말해라."],["I think I left my bag at the table.","식당에서 나오니 가방이 없다. 자리에 두고 온 것 같다고 말해라."],["I think I left my purchase at the counter.","산 물건을 안 들고 나왔다. 계산대에 두고 온 것 같다고 말해라."],["I think I left my glasses in the fitting room.","옷을 갈아입고 나오니 안경이 없다. 탈의실에 두고 온 것 같다고 말해라."],["I think I left my phone at the food court.","푸드코트에서 나오니 핸드폰이 없다. 두고 온 것 같다고 말해라."]]},{"f":"Does that mean ~?","k":"그럼 ~라는 뜻이에요?","i":[["Does that mean I can't order?","마감시간이 지났다고 한다. 그럼 주문을 못 한다는 뜻이냐고 되물어라."],["Does that mean the tour is canceled?","날씨가 안 좋다고 한다. 그럼 투어가 취소라는 뜻이냐고 되물어라."],["Does that mean I have to pay more?","추가 요금이 있다고 한다. 그럼 돈을 더 내야 한다는 뜻이냐고 되물어라."],["Does that mean we have to wait?","배가 늦는다고 한다. 그럼 더 기다려야 한다는 뜻이냐고 되물어라."],["Does that mean it's cash only?","카드가 안 된다고 한다. 그럼 현금만 된다는 뜻이냐고 되물어라."],["Does that mean we go there ourselves?","픽업이 없다고 한다. 그럼 우리가 직접 가야 한다는 뜻이냐고 되물어라."],["Does that mean we need another hotel?","방이 없다고 한다. 그럼 다른 호텔을 찾아야 한다는 뜻이냐고 되물어라."],["Does that mean we can't swim today?","파도가 높다고 한다. 그럼 오늘 수영을 못 한다는 뜻이냐고 되물어라."],["Does that mean breakfast is over?","조식 시간이 끝났다고 한다. 그럼 아침을 못 먹는다는 뜻이냐고 되물어라."],["Does that mean I have to book again?","예약이 취소됐다고 한다. 그럼 다시 예약해야 한다는 뜻이냐고 되물어라."],["Does that mean we can't check in yet?","방 청소가 안 끝났다고 한다. 그럼 아직 체크인을 못 한다는 뜻이냐고 되물어라."],["Does that mean the price goes up?","성수기라고 한다. 그럼 값이 올라간다는 뜻이냐고 되물어라."],["Does that mean we miss the boat?","길이 많이 막힌다고 한다. 그럼 배를 놓친다는 뜻이냐고 되물어라."],["Does that mean I can't take this on the plane?","이건 안 된다고 한다. 그럼 기내에 못 들고 탄다는 뜻이냐고 되물어라."],["Does that mean we need a different room?","침대가 하나뿐이라고 한다. 그럼 다른 방이 필요하다는 뜻이냐고 되물어라."],["Does that mean this one is sold out?","그건 지금 없다고 한다. 그럼 이게 다 팔렸다는 뜻이냐고 되물어라."],["Does that mean we have to wait for a table?","지금은 자리가 없다고 한다. 그럼 자리를 기다려야 한다는 뜻이냐고 되물어라."],["Does that mean I can't return it?","세일 상품이라고 한다. 그럼 반품이 안 된다는 뜻이냐고 되물어라."],["Does that mean the kitchen is closed?","지금은 주문이 안 된다고 한다. 그럼 주방이 닫혔다는 뜻이냐고 되물어라."],["Does that mean the discount is over?","세일이 어제까지였다고 한다. 그럼 할인이 끝났다는 뜻이냐고 되물어라."]]},{"f":"Could you say that again, more slowly?","k":"다시 천천히 말해 주실래요?","i":[["Could you say that again, more slowly?","직원이 너무 빨리 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","공항 안내 방송을 놓쳤다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","가이드가 빠르게 설명하고 지나갔다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","전화 목소리가 너무 빨랐다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","길을 물었는데 설명이 너무 빨랐다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","가격을 말했는데 숫자를 못 들었다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","기사가 요금을 말했는데 못 알아들었다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","약 먹이는 방법을 너무 빨리 설명한다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","체크인 규정을 빠르게 설명하고 넘어갔다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","투어 집합 장소를 말해줬는데 못 들었다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","버스 기사가 내릴 곳을 빠르게 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","병원에서 접수 안내를 빠르게 했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","식당에서 오늘의 메뉴를 빠르게 읊었다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","면세점 직원이 규정을 빠르게 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","조식 시간을 말해줬는데 못 들었다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","점원이 할인 조건을 빠르게 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","오늘 안 되는 메뉴를 빠르게 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","계산대에서 금액을 빠르게 말했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","환불 절차를 빠르게 설명했다. 천천히 다시 말해달라고 해라."],["Could you say that again, more slowly?","배송 날짜를 말해줬는데 못 들었다. 천천히 다시 말해달라고 해라."]]},{"f":"What do you recommend?","k":"뭐가 좋아요?","i":[["What do you recommend?","식당인데 메뉴가 너무 많다. 뭐가 맛있는지 추천을 부탁해라."],["What do you recommend for a family?","투어 종류가 많다. 가족한테 뭐가 좋은지 추천을 부탁해라."],["What do you recommend to drink?","카페에 처음 왔다. 뭘 마실지 추천을 부탁해라."],["What do you recommend for a gift?","회사에 줄 선물을 사야 한다. 선물용으로 추천을 부탁해라."],["What do you recommend for snorkeling?","해변이 여러 곳이다. 스노클링은 어디가 좋은지 추천을 부탁해라."],["What do you recommend for a first visit?","첫 방문이다. 어디를 먼저 보면 좋을지 추천을 부탁해라."],["What do you recommend that's not spicy?","매운 걸 못 먹는다. 안 매운 걸로 추천을 부탁해라."],["What do you recommend for kids?","아이들이 먹을 걸 골라야 한다. 뭐가 좋은지 추천을 부탁해라."],["What do you recommend around here?","숙소 근처에서 저녁을 먹으려 한다. 추천을 부탁해라."],["What do you recommend for tomorrow?","하루가 통째로 비었다. 내일 뭘 하면 좋을지 추천을 부탁해라."],["What do you recommend for breakfast?","아침에 뭘 먹을지 모르겠다. 추천을 부탁해라."],["What do you recommend for a rainy day?","비가 온다. 오늘 뭘 하면 좋을지 추천을 부탁해라."],["What do you recommend for seafood?","해산물을 먹고 싶다. 어디가 좋은지 추천을 부탁해라."],["What do you recommend for sunset?","노을을 보고 싶다. 어디가 좋은지 추천을 부탁해라."],["What do you recommend for a half day?","반나절이 비었다. 뭘 하면 좋을지 추천을 부탁해라."],["What do you recommend on the menu?","메뉴판을 봐도 뭘 시킬지 모르겠다. 추천을 부탁해라."],["What do you recommend for two people?","둘이 나눠 먹으려 한다. 뭘 시킬지 추천을 부탁해라."],["What do you recommend for souvenirs?","기념품을 사려 한다. 뭐가 좋은지 추천을 부탁해라."],["What do you recommend that's local?","현지 음식을 먹고 싶다. 뭐가 좋은지 추천을 부탁해라."],["What do you recommend to buy here?","시장에 왔다. 뭘 사면 좋을지 추천을 부탁해라."]]},{"f":"Can we change ~?","k":"~ 바꿀 수 있을까요?","i":[["Can we change the date?","일정이 바뀌었다. 투어 날짜를 바꿀 수 있는지 물어라."],["Can we change rooms?","옆방 소리가 다 들린다. 방을 바꿀 수 있는지 물어라."],["Can we change the time?","저녁 일정이 밀렸다. 식당 예약 시간을 바꿀 수 있는지 물어라."],["Can we change seats?","식당에서 가족이 떨어져 앉았다. 자리를 바꿀 수 있는지 물어라."],["Can we change the pickup place?","호텔 말고 공항에서 타고 싶다. 픽업 장소를 바꿀 수 있는지 물어라."],["Can we change the number of people?","한 명이 더 가게 됐다. 인원을 바꿀 수 있는지 물어라."],["Can we change our order?","아직 음식이 안 나왔다. 주문을 바꿀 수 있는지 물어라."],["Can we change to a bigger room?","방이 너무 좁다. 큰 방으로 바꿀 수 있는지 물어라."],["Can I change some money here?","현금이 필요하다. 여기서 돈을 바꿀 수 있는지 물어라."],["Can I change my flight?","돌아가는 날이 바뀌었다. 비행기를 바꿀 수 있는지 물어라."],["Can we change to a quieter room?","밤에 도로 소음이 심하다. 조용한 방으로 바꿀 수 있는지 물어라."],["Can we change the tour?","다른 투어가 더 좋아 보인다. 투어를 바꿀 수 있는지 물어라."],["Can I change my seat on the plane?","가족과 떨어져 앉았다. 비행기 자리를 바꿀 수 있는지 물어라."],["Can we change the check-out time?","비행기가 늦다. 체크아웃 시간을 바꿀 수 있는지 물어라."],["Can I change this shirt for a bigger one?","옷이 작다. 큰 걸로 바꿀 수 있는지 물어라."],["Can we change tables?","자리가 에어컨 바로 아래다. 자리를 바꿀 수 있는지 물어라."],["Can I change this for another color?","색이 마음에 안 든다. 다른 색으로 바꿀 수 있는지 물어라."],["Can we change the drink?","세트에 딸린 음료가 싫다. 음료를 바꿀 수 있는지 물어라."],["Can I change the delivery date?","배송 날짜가 안 맞는다. 날짜를 바꿀 수 있는지 물어라."],["Can we change to a set menu?","단품보다 세트가 나아 보인다. 세트로 바꿀 수 있는지 물어라."]]},{"f":"Is this the right ~?","k":"이거 맞나요?","i":[["Is this the right bus?","공항 가는 버스인지 확실하지 않다. 이 버스가 맞는지 기사에게 물어라."],["Is this the right gate?","게이트 앞에 왔는데 표시가 헷갈린다. 이 게이트가 맞는지 물어라."],["Is this the right line?","체크인 줄이 여러 개다. 이 줄이 맞는지 물어라."],["Is this the right stop?","내릴 정류장인지 확실하지 않다. 여기서 내리는 게 맞는지 물어라."],["Is this the right pier?","부두가 여러 개다. 배 타는 곳이 맞는지 물어라."],["Is this the right building?","지도대로 왔는데 확실하지 않다. 이 건물이 맞는지 물어라."],["Is this the right way?","갈림길에 섰다. 이 길이 맞는지 물어라."],["Is this the right counter?","창구가 여러 개다. 이 창구가 맞는지 물어라."],["Is this the right boat?","배가 여러 대 대어 있다. 우리 배가 맞는지 물어라."],["Is this the right size?","옷을 골랐다. 이 사이즈가 맞는지 물어라."],["Is this the right room?","카드키가 안 열린다. 이 방이 맞는지 물어라."],["Is this the right seat?","표에 적힌 자리를 찾았다. 이 자리가 맞는지 물어라."],["Is this the right address?","기사에게 주소를 보여줬다. 이 주소가 맞는지 물어라."],["Is this the right amount?","환전을 했다. 받은 금액이 맞는지 /* ── 설정 ─────────────────────────────────────────── */
const PROXY = "https://speaking-room.thdghkstlr.workers.dev";
const VOICE  = "en-US-JennyNeural";
const KEY    = "shadow:cfg";

const D = (function(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } })();
const cfg = Object.assign({ rate:0.95, gap:1.0, per:5, ko:1 }, D);
const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} };

/* ── 재생 — 워커 음성(mp3) 우선, 안 되면 브라우저 음성 ── */
const cache = new Map();
let audio = null, dead = false;
async function speak(text, rate, onEnd){
  const done = ()=>{ try{ onEnd&&onEnd(); }catch(e){} };
  if(!dead){
    try{
      const k = rate.toFixed(2)+"|"+text;
      let url = cache.get(k);
      if(!url){
        const r = await fetch(PROXY+"/tts?voice="+encodeURIComponent(VOICE)+"&rate="+rate.toFixed(2)+"&text="+encodeURIComponent(text));
        if(r.status===404){ dead = true; throw 0; }
        if(!r.ok) throw 0;
        const blob = await r.blob();
        if(!blob || blob.size < 200) throw 0;
        url = URL.createObjectURL(blob);
        cache.set(k, url);
      }
      audio = new Audio(url);
      audio.onended = done;
      await audio.play();
      return;
    }catch(e){ /* 아래 브라우저 음성으로 */ }
  }
  const S = window.speechSynthesis, U = window.SpeechSynthesisUtterance;
  if(!S || !U){ setTimeout(done, 900); return; }
  try{ S.cancel(); }catch(e){}
  setTimeout(()=>{
    const u = new U(text);
    u.lang = "en-US"; u.rate = rate;
    const v = (S.getVoices()||[]).find(x=>/^en-US/i.test(x.lang));
    if(v) u.voice = v;
    let fired = false; const once = ()=>{ if(fired) return; fired = true; done(); };
    u.onend = once; u.onerror = once;
    S.speak(u);
    setTimeout(once, Math.max(2500, text.length*130));   // onend 가 안 오는 브라우저 대비
  }, 90);
}
function silence(){
  try{ if(audio){ audio.onended=null; audio.pause(); audio=null; } }catch(e){}
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
}

/* ── 상태 ─────────────────────────────────────────── */
let fi = 0, si = 0, playing = false, timer = null, items = [];

/* 20개 중 고르게 흩어 뽑는다 — 매번 같은 문장만 듣지 않게 */
function pick(f, n){
  const N = f.i.length, step = Math.max(1, Math.floor(N/n)), off = (Math.random()*N)|0, out = [];
  for(let k=0; out.length < Math.min(n,N); k++) out.push(f.i[(off+k*step)%N]);
  return out;
}
function loadFrame(k){
  fi = (k + FRAMES.length) % FRAMES.length;
  si = 0;
  items = pick(FRAMES[fi], cfg.per);
}

/* ── 그리기 ───────────────────────────────────────── */
const $ = id => document.getElementById(id);
function drawList(){
  $("list").innerHTML = FRAMES.map((f,k)=>
    `<button class="fr${k===fi?" on":""}${k<fi?" done":""}" data-k="${k}">
       <span class="n">${k+1}</span><span class="t">${f.f}</span></button>`).join("");
  $("list").querySelectorAll(".fr").forEach(b=>{
    b.onclick = ()=>{ const on = playing; stop(); loadFrame(+b.dataset.k); draw(); if(on) play(); };
  });
  const on = $("list").querySelector(".fr.on");
  if(on) on.scrollIntoView({block:"nearest"});
}
function draw(){
  const f = FRAMES[fi], it = items[si];
  $("frame").textContent = f.f;
  $("frameKo").textContent = f.k;
  $("line").textContent = it[0];
  $("lineKo").textContent = cfg.ko ? it[1] : "";
  $("dots").innerHTML = items.map((x,k)=>`<i class="${k===si?"c":k<si?"p":""}"></i>`).join("");
  $("bar").style.width = ((fi + (si+1)/items.length) / FRAMES.length * 100) + "%";
  $("toggle").textContent = playing ? "❚❚" : "▶";
  drawList();
}
function drawSegs(){
  const seg = (label, key, opts) =>
    `<div class="seg"><span>${label}</span><div class="opts">` +
    opts.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${cfg[key]==v?"on":""}">${t}</button>`).join("") +
    `</div></div>`;
  $("segs").innerHTML =
    seg("속도","rate",[[0.75,"느리게"],[0.95,"보통"],[1.1,"빠르게"]]) +
    seg("따라 말할 틈","gap",[[0.6,"짧게"],[1,"보통"],[1.7,"길게"]]) +
    seg("문장 수","per",[[3,"3"],[5,"5"],[10,"10"],[20,"전부"]]) +
    seg("한국어","ko",[[1,"보기"],[0,"숨기기"]]);
  $("segs").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{
      const on = playing; stop();
      cfg[b.dataset.k] = parseFloat(b.dataset.v); save();
      if(b.dataset.k === "per"){ const keep = fi; loadFrame(keep); }
      drawSegs(); draw(); if(on) play();
    };
  });
}

/* ── 재생 흐름 ────────────────────────────────────── */
function stop(){
  playing = false;
  if(timer){ clearTimeout(timer); timer = null; }
  silence();
  $("toggle").textContent = "▶";
  $("hint").textContent = "";
  $("hint").className = "hint";
}
function play(){
  playing = true;
  $("toggle").textContent = "❚❚";
  step();
}
function step(){
  if(!playing) return;
  const it = items[si];
  draw();
  $("hint").textContent = "듣기";
  $("hint").className = "hint";
  const words = it[0].split(/\s+/).length;
  const gap = Math.max(1100, words * 360) * cfg.gap;
  speak(it[0], cfg.rate, ()=>{
    if(!playing) return;
    $("hint").textContent = "따라 말해보세요";
    $("hint").className = "hint on";
    timer = setTimeout(()=>{
      if(!playing) return;
      si++;
      if(si >= items.length){ loadFrame(fi + 1); }
      step();
    }, gap);
  });
}
function jump(d){
  const on = playing; stop();
  loadFrame(fi + d); draw();
  if(on) play();
}
function stepLine(d){
  const on = playing; stop();
  si += d;
  if(si < 0){ loadFrame(fi - 1); si = items.length - 1; }
  else if(si >= items.length){ loadFrame(fi + 1); }
  draw();
  if(on) play();
}

/* ── 조작 ─────────────────────────────────────────── */
$("toggle").onclick = ()=> playing ? stop() : play();
$("prev").onclick = ()=> jump(-1);
$("next").onclick = ()=> jump(1);
document.addEventListener("keydown", e=>{
  if(e.target.tagName === "INPUT") return;
  const k = e.key;
  if(k === " "){ e.preventDefault(); playing ? stop() : play(); }
  else if(k === "ArrowLeft"){ e.preventDefault(); jump(-1); }
  else if(k === "ArrowRight"){ e.preventDefault(); jump(1); }
  else if(k === "ArrowUp"){ e.preventDefault(); stepLine(-1); }
  else if(k === "ArrowDown"){ e.preventDefault(); stepLine(1); }
  else if(k === "r" || k === "R"){ e.preventDefault(); const on = playing; stop(); draw(); if(on) play(); }
});

loadFrame(0);
drawSegs();
draw();

</script>
